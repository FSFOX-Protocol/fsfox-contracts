name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile contracts
      run: npm run compile

    - name: Run tests
      run: npm test

  secret-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for committed secrets
      run: |
        # Fail if a hard-coded private key / secret-looking assignment is tracked.
        # Matches: PRIVATE_KEY=<64 hex>, a raw 0x+64-hex literal in code, or a tracked .env file.
        # (Placeholders like "your_private_key_here" and process.env.PRIVATE_KEY are fine;
        #  tx hashes / calldata in *.md docs are public and intentionally not scanned.)
        status=0
        if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v 'env.example'; then
          echo "❌ A .env file is tracked by git"; status=1
        fi
        if git grep -nIE '(PRIVATE_KEY|MNEMONIC|SECRET)[A-Z_]*[[:space:]]*[=:][[:space:]]*["'"'"']?(0x)?[0-9a-fA-F]{64}' -- . ':!package-lock.json'; then
          echo "❌ Hard-coded private key assignment found"; status=1
        fi
        if git grep -nIE '["'"'"']0x[0-9a-fA-F]{64}["'"'"']' -- '*.js' '*.sol' ':!package-lock.json'; then
          echo "❌ 64-hex literal (possible private key) in code"; status=1
        fi
        if git grep -nIiE '(api[_-]?key|apikey|secret)["'"'"']?[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9_-]{24,}["'"'"']' -- '*.js' '*.json' '*.yml' ':!package-lock.json' ':!token-list.json'; then
          echo "❌ Possible hard-coded API key/token"; status=1
        fi
        if [ "$status" -ne 0 ]; then exit 1; fi
        echo "✅ No secrets found in tracked files"
